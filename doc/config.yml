Content:
    Canary:
        root_dir: ${ROOT_DIR}/doc/content
    moose:
        root_dir: ${MOOSE_DIR}/framework/doc/content
        # Only the assets needed to render the site are pulled from MOOSE. The
        # framework's own object pages (source/**, syntax/**) are deliberately
        # NOT included: they autolink to each other and to the large_media
        # submodule, so including any subset produces broken-link errors and
        # including all of them requires cloning large_media (~GB) in CI.
        # Canary pages therefore link to mooseframework.inl.gov for object
        # documentation, while '!syntax' commands below still render locally
        # because they are generated from the executable, not from these pages.
        content:
            - bib/**
            - contrib/**
            - css/*
            - js/*
            - media/**
Renderer:
    type: MooseDocs.base.MaterializeRenderer
Extensions:
    MooseDocs.extensions.navigation:
        name: Canary
        repo: https://github.com/aurora-multiphysics/canary
        menu:
            Problems: problems/index.md
    MooseDocs.extensions.appsyntax:
        # Canary deliberately has no executable of its own; the syntax dump is
        # taken from the moose_test application already built in MOOSE_DIR. In
        # CI, where MOOSE is installed rather than built from source, the
        # documentation workflow links the container's prebuilt binary into
        # ${MOOSE_DIR}/test so that this path works there too.
        executable: ${MOOSE_DIR}/test
        app_name: moose_test
        remove: !include ${MOOSE_DIR}/framework/doc/remove.yml
        includes:
            - ${MOOSE_DIR}/framework/include
        inputs:
            - ${ROOT_DIR}/test/tests
    MooseDocs.extensions.common:
        shortcuts: !include ${MOOSE_DIR}/framework/doc/globals.yml
    MooseDocs.extensions.acronym:
        acronyms: !include ${MOOSE_DIR}/framework/doc/acronyms.yml
