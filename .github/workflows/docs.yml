---
name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Allow one Pages deployment at a time, and never cancel one that is in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    name: BuildDocs
    env:
      PRCOMMITSHA: ${{ github.event.pull_request.head.sha }}
      PRREPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      MOOSE_CONTAINER: oras://ghcr.io/idaholab/apptainer/moose-openmpi-x86_64:2026.08.12-167ee97
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6
      - name: Pull MOOSE apptainer container
        run: apptainer build moose-openmpi.sif "$MOOSE_CONTAINER"
      - name: Create apptainer instance
        run: apptainer instance start moose-openmpi.sif moose_instance
      - name: Checkout Canary
        run: apptainer exec instance://moose_instance bash -c "git clone https://github.com/${PRREPOSITORY:-$GITHUB_REPOSITORY}.git && cd canary && git checkout ${PRCOMMITSHA:-$GITHUB_SHA}"
      # Diagnostic only. MooseDocs needs a MOOSE *source* tree that is a git
      # checkout (it runs 'git ls-files' on MOOSE_DIR at import) plus a built
      # executable. This step reports whether the container satisfies both, and
      # where the executable lives: doc/config.yml expects
      # /opt/moose/test/moose_test-opt, whereas an installed MOOSE provides
      # /opt/moose/bin/moose-opt and would need 'executable: ${MOOSE_DIR}/bin'
      # with 'app_name: moose'.
      - name: Inspect MOOSE installation
        run: |
          apptainer exec instance://moose_instance bash -c '
            echo "--- /opt/moose ---"; ls /opt/moose
            echo "--- git repo? ---"
            git -C /opt/moose rev-parse --is-inside-work-tree || true
            echo "--- executables ---"
            ls /opt/moose/test/moose_test-* /opt/moose/bin/*-opt 2>/dev/null || true
            echo "--- large_media ---"
            ls /opt/moose/large_media 2>/dev/null | head -n 5 || true'
      - name: Build documentation
        run: |
          apptainer exec instance://moose_instance bash -c '
            set -e
            site="$PWD/site"
            cd canary/doc
            export MOOSE_DIR=/opt/moose
            ./moosedocs.py build --destination "$site"'
      - name: Close apptainer instance
        run: apptainer instance stop moose_instance
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: DeployDocs
    if: github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
