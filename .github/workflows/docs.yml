---
name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Allow one Pages deployment at a time, and never cancel one that is in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    name: BuildDocs
    env:
      PRCOMMITSHA: ${{ github.event.pull_request.head.sha }}
      PRREPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      MOOSE_CONTAINER: oras://ghcr.io/idaholab/apptainer/moose-openmpi-x86_64:2026.08.12-167ee97
      # Where MOOSE was built when the container was assembled. Every object in
      # the syntax dump records its own .C file under this path, and MooseDocs
      # discards any object whose source file is missing, so the source tree has
      # to be mounted here. If a container bump moves it, the build log names the
      # new path ("The supplied 'source' file does not exist: ...").
      MOOSE_BUILD_DIR: /root/build/moose
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6
      - name: Pull MOOSE apptainer container
        run: apptainer build moose-openmpi.sif "$MOOSE_CONTAINER"
      # The container ships an *installed* MOOSE (/opt/moose/{bin,include,lib,
      # share}), which carries no framework/doc content, and MooseDocs runs
      # 'git ls-files' on MOOSE_DIR when it is imported. So the docs build needs
      # a MOOSE source checkout in addition to the container. The revision is
      # taken from the container tag so the two always agree.
      - name: Checkout MOOSE source
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/idaholab/moose.git moose
          git -C moose checkout "${MOOSE_CONTAINER##*-}"
          # MooseDocs initialises the large_media submodule (several GB) as it
          # is imported. Canary references none of that content, so drop the
          # gitlink from the index; 'git submodule status' then stops reporting
          # it and nothing is cloned. Leave .gitmodules alone -- removing its
          # section without the gitlink makes that command fail with
          # "no submodule mapping found". The now-empty directory is kept
          # because MooseDocs indexes it straight after initialising.
          git -C moose rm --cached --quiet large_media
          mkdir -p moose/large_media
      # doc/config.yml looks for the executable in ${MOOSE_DIR}/test, where a
      # source build puts it. Linking the container's prebuilt binary there lets
      # the same config serve both CI and a local source checkout.
      - name: Link MOOSE executable
        run: ln -s /opt/moose/bin/moose_test-opt moose/test/moose_test-opt
      - name: Create apptainer instance
        run: |
          apptainer instance start \
            --bind "$PWD/moose:$MOOSE_BUILD_DIR" \
            moose-openmpi.sif moose_instance
      - name: Checkout Canary
        run: apptainer exec instance://moose_instance bash -c "git clone https://github.com/${PRREPOSITORY:-$GITHUB_REPOSITORY}.git && cd canary && git checkout ${PRCOMMITSHA:-$GITHUB_SHA}"
      - name: Build documentation
        run: |
          apptainer exec instance://moose_instance bash -c '
            set -e
            site="$PWD/site"
            cd canary/doc
            export MOOSE_DIR='"$MOOSE_BUILD_DIR"'
            ./moosedocs.py build --destination "$site"'
      - name: Close apptainer instance
        run: apptainer instance stop moose_instance
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: DeployDocs
    if: github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
