---
name: MOOSE container

# Builds MOOSE containers on top of IDAHO's compiler and MPI image. Two images
# are pushed to GHCR:
#
#   canary-moose-dev  MOOSE's dependencies (docker/moose-dev)
#   canary-moose      MOOSE itself, configured with MFEM (docker/moose)
#
# Which MOOSE is built, and how it is tagged once it has passed MOOSE's MFEM
# tests and Canary's own tests, depends on what started the run:
#
#   push to main      the pinned MOOSE_REVISION below, tagged
#                     <date>-<MOOSE revision> and 'latest', which is the image
#                     meant to replace IDAHO's in the other workflows
#   weekly schedule   the head of MOOSE next, tagged <date>-<MOOSE revision>
#                     and 'next', to show whether MOOSE_REVISION can be moved on
#   manual run        MOOSE_REVISION, tagged as for a push if run from main, or
#                     the moose-revision input, tagged <date>-<MOOSE revision>;
#                     from another branch, tagged <branch>-<MOOSE revision>
#   pull request      MOOSE_REVISION, tagged pr-<number>
#
# The two images are built in their own jobs so that each stays within the
# six hour limit for GitHub-hosted runners. The build jobs push the images by
# digest only, and pass them on that way; nothing is tagged until the tests
# have passed, so that no tag points at an untested image.

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      moose-revision:
        description: >-
          MOOSE commit, branch or tag to build instead of the pinned
          MOOSE_REVISION; such builds are not tagged latest or next
        required: false
  push:
    branches:
      - main
    paths:
      - docker/**
      - .github/workflows/moose-container.yml
  pull_request:
    branches:
      - main
    paths:
      - docker/**
      - .github/workflows/moose-container.yml

permissions:
  contents: read

concurrency:
  group: moose-container-${{ github.event_name == 'schedule' && 'next' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # MOOSE revision that is tagged latest: the head of MOOSE next on 2026-10-26.
  # Update it, ideally to a weekly 'next' build that passed, to move Canary onto
  # a newer MOOSE. It has to be a full commit SHA; that of an image is in its
  # org.opencontainers.image.version label and its MOOSE_REVISION variable.
  MOOSE_REVISION: baffee920c5de26d319fd6bfd8386e273086675f
  MOOSE_DEV_IMAGE: ghcr.io/${{ github.repository_owner }}/canary-moose-dev
  MOOSE_IMAGE: ghcr.io/${{ github.repository_owner }}/canary-moose

jobs:
  prepare:
    name: Prepare
    # Pull requests from forks cannot push to the registry
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
      mpi-image: ${{ steps.prepare.outputs.mpi-image }}
      tag: ${{ steps.prepare.outputs.tag }}
      release-tag: ${{ steps.prepare.outputs.release-tag }}
    steps:
      - name: Determine MOOSE revision and image tag
        id: prepare
        env:
          REQUESTED_REVISION: >-
            ${{ github.event_name == 'schedule' && 'next'
            || inputs.moose-revision || env.MOOSE_REVISION }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Otherwise no build of it could ever be tagged latest
          if ! [[ "$MOOSE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::MOOSE_REVISION must be a full 40 character commit SHA"
            exit 1
          fi
          git init --quiet moose
          git -C moose fetch --quiet --depth 1 \
            https://github.com/idaholab/moose.git "$REQUESTED_REVISION"
          # ^{commit} resolves an annotated tag to the commit it points to
          revision=$(git -C moose rev-parse 'FETCH_HEAD^{commit}')
          # The compiler and MPI image that MOOSE builds its own containers
          # from at this revision, pinned by digest
          mpi_image=$(git -C moose show FETCH_HEAD:apptainer/mpi.def |
            sed -n 's/^ *"ubuntu24_gcc": *"\([^"]*\)".*/\1/p')
          test -n "$mpi_image"
          if [ -n "$PR_NUMBER" ]; then
            tag="pr-${PR_NUMBER}"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            tag="$(date -u +%Y.%m.%d)-${revision:0:7}"
          else
            # A manual run from another branch must not replace an image
            # built from main, so it is tagged by branch instead of by date
            branch=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')
            tag="${branch:0:100}-${revision:0:7}"
          fi
          # Only builds of the pinned revision from main become latest, and
          # only the weekly builds of MOOSE next become next
          release_tag=
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            release_tag=next
          elif [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ] &&
            [ "$revision" = "$MOOSE_REVISION" ]; then
            release_tag=latest
          fi
          echo "MOOSE revision: ${revision}"
          echo "MPI image: ${mpi_image}"
          echo "Image tag: ${tag}"
          echo "Release tag: ${release_tag:-none}"
          {
            echo "revision=${revision}"
            echo "mpi-image=${mpi_image}"
            echo "tag=${tag}"
            echo "release-tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

  build-moose-dev:
    name: Build canary-moose-dev
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/moose-dev
          tags: ${{ env.MOOSE_DEV_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # Kept per MOOSE revision, so that a change to docker/moose alone,
          # or a re-run, does not rebuild the dependencies. mode=max also keeps
          # the source stage, which every build step mounts.
          cache-from: type=registry,ref=${{ env.MOOSE_DEV_IMAGE }}:buildcache-${{ needs.prepare.outputs.revision }}
          cache-to: type=registry,ref=${{ env.MOOSE_DEV_IMAGE }}:buildcache-${{ needs.prepare.outputs.revision }},mode=max
          build-args: |
            MOOSE_REVISION=${{ needs.prepare.outputs.revision }}
            MOOSE_MPI_IMAGE=${{ needs.prepare.outputs.mpi-image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=MOOSE dependencies, including MFEM, for Canary
            org.opencontainers.image.version=${{ needs.prepare.outputs.revision }}

  build-moose:
    name: Build canary-moose
    needs: [prepare, build-moose-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/moose
          tags: ${{ env.MOOSE_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.MOOSE_IMAGE }}:buildcache-${{ needs.prepare.outputs.revision }}
          cache-to: type=registry,ref=${{ env.MOOSE_IMAGE }}:buildcache-${{ needs.prepare.outputs.revision }}
          build-args: |
            MOOSE_DEV_IMAGE=${{ env.MOOSE_DEV_IMAGE }}@${{ needs.build-moose-dev.outputs.digest }}
            MOOSE_REVISION=${{ needs.prepare.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=MOOSE, configured with MFEM, for Canary
            org.opencontainers.image.version=${{ needs.prepare.outputs.revision }}

  test:
    name: Test canary-moose
    needs: [prepare, build-moose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Apptainer keeps the pulled layers, the unpacked image and the SIF
      # built from it on disk at the same time
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6
      # Pulled the same way as in the other workflows, so this also checks
      # that apptainer can use the image
      - name: Pull MOOSE apptainer container
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          MOOSE_CONTAINER: docker://${{ env.MOOSE_IMAGE }}@${{ needs.build-moose.outputs.digest }}
        run: apptainer build moose.sif "$MOOSE_CONTAINER"
      - name: Run MOOSE MFEM tests
        # $RUNNER_TEMP has to be expanded by the shell inside the container
        # rather than by the runner, so it is deliberately single quoted.
        run: |
          # shellcheck disable=SC2016
          apptainer exec moose.sif bash -c '
            set -e
            moose_test-opt --check-capabilities mfem
            cd "$RUNNER_TEMP"
            moose_test-opt --copy-inputs tests
            cd moose_test/tests
            moose_test-opt --run -j 4 --re mfem'
      - name: Run Canary tests
        run: apptainer exec moose.sif bash -c "export MOOSE_DIR=/opt/moose && ./run_tests -j 4"

  release:
    name: Tag images
    needs: [prepare, build-moose-dev, build-moose, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The runner's own buildx plugin is enough for imagetools, which works
      # on the registry alone
      - name: Tag images
        env:
          MOOSE_DEV_DIGEST: ${{ needs.build-moose-dev.outputs.digest }}
          MOOSE_DIGEST: ${{ needs.build-moose.outputs.digest }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: |
          for image in "${MOOSE_DEV_IMAGE}@${MOOSE_DEV_DIGEST}" "${MOOSE_IMAGE}@${MOOSE_DIGEST}"; do
            tags=(--tag "${image%@*}:${TAG}")
            if [ -n "$RELEASE_TAG" ]; then
              tags+=(--tag "${image%@*}:${RELEASE_TAG}")
            fi
            docker buildx imagetools create "${tags[@]}" "$image"
          done
