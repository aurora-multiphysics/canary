---
name: BuildTest
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-canary-tests:
    runs-on: ubuntu-latest
    name: RunCanaryTests
    permissions:
      contents: read
      packages: read
    env:
      PRCOMMITSHA: ${{ github.event.pull_request.head.sha }}
      PRREPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      # Built weekly by moose-container.yml
      MOOSE_CONTAINER: docker://ghcr.io/aurora-multiphysics/canary-moose:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: PrintGithubContext
      run: echo "${PRCOMMITSHA:-$GITHUB_SHA}" "${PRREPOSITORY:-$GITHUB_REPOSITORY}"
    - name: Setup Apptainer
      uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.3.6
    - name: Pull MOOSE apptainer container
      env:
        APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
        APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: apptainer build moose.sif "$MOOSE_CONTAINER"
    - name: Create apptainer instance
      run: apptainer instance start moose.sif moose_instance
    - name: Checkout Canary
      run: apptainer exec instance://moose_instance bash -c "git clone https://github.com/${PRREPOSITORY:-$GITHUB_REPOSITORY}.git && cd canary && git checkout ${PRCOMMITSHA:-$GITHUB_SHA}"
    - name: Run Canary tests
      run: apptainer exec instance://moose_instance bash -c "cd canary && export MOOSE_DIR=/opt/moose && ./run_tests"
    - name: Close apptainer instance
      run: apptainer instance stop moose_instance
