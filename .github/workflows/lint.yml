---
name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: { }

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # External doxygen style files, the MOOSE Doxygen header, and the CodeCov upload script
          # do not meet Canary linting requirements; exclude them from lint checks:
          FILTER_REGEX_EXCLUDE: ((^|/)doxygen-awesome|moose_doxy_header.html|doxygen.css|tabs.css|codecov.sh)
          VALIDATE_ANSIBLE: false
          VALIDATE_CHECKOV: false
          VALIDATE_CPP: false
          # Flags every action not pinned to a commit SHA, across all workflows
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_JSCPD: false
          # Its fixes break MooseDocs shortcut links and equations; markdownlint checks style
          VALIDATE_MARKDOWN_PRETTIER: false
          # Would rerun the pre-commit hooks, which duplicate super-linter's own linters
          VALIDATE_PRE_COMMIT: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          # Its Dockerfile checks duplicate hadolint's, and the images are meant to run as root
          VALIDATE_TRIVY: false
          # YAML style is checked by yamllint
          VALIDATE_YAML_PRETTIER: false
